name: Forma360 CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, SQL RLS, Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript check
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Unit, Component & PostgreSQL RLS Tests (Vitest + PGlite)
        run: npm run test

      - name: Next.js Production Build
        run: npm run build

      - name: Install Playwright Chromium & system dependencies
        run: npx playwright install --with-deps chromium

      - name: Critical End-to-End Flows (Playwright)
        run: npm run test:e2e
